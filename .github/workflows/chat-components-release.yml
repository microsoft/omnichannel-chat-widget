name: chat-components-release

on:
  push:
    tags:
      - 'c-v*'
    paths:
      - 'chat-components/**'

jobs:
  build:
    if: github.repository == 'microsoft/omnichannel-chat-widget'
    runs-on: windows-2022
    steps:
      - name: Checking out for ${{ github.ref }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.X
      - name: Update package version
        working-directory: chat-components
        run: npx version-from-git --no-git-tag-version
        if: ${{ startsWith(github.ref, 'refs/heads/') }}
      - name: Read package.json
        id: read-package-json
        working-directory: chat-components
        run: |
          echo "::set-output name=name::$(cat package.json | jq -r '.name')"
          echo "::set-output name=version::$(cat package.json | jq -r '.version')"
      - name: Install packages
        working-directory: chat-components
        run: yarn install --network-timeout 100000
      - name: Unit Tests
        working-directory: chat-components
        run: yarn test:unit
      - name: Build Storybook
        working-directory: chat-components
        env :
          NODE_OPTIONS: --openssl-legacy-provider        
        run: yarn build-storybook
      - name: VRT Tests
        working-directory: chat-components
        run: yarn test:visual
      - name: Upload VRT Tests failures screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: VRT Failure Screenshots
          path: 'chat-components/**/__diff_output__/*.png'
      - name: Build package
        working-directory: chat-components
        run: yarn build
      - name: Npm packaging
        working-directory: chat-components
        run: npm pack
      - name: Move package tarball to root
        working-directory: chat-components
        run: |
          mv *.tgz ../
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: '*.tgz'

