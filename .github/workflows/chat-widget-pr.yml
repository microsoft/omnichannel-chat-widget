permissions:
  contents: read       # For checkout
  actions: write       # For downloading and uploading artifacts
  pull-requests: write # For DangerJS to comment on PRs
  checks: write        # For writing check results

name: chat-widget-pr

on:
  pull_request:
    branches:
      - '**'
    types: [edited, assigned, opened, synchronize, reopened]
    paths:
      - 'chat-widget/**'
      - '.github/workflows/**'
      
jobs: 
  build:
    runs-on: windows-2022
    steps:
      - name: Checking out for ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packages
        working-directory: chat-widget
        run: yarn install --network-timeout 1000000
      - name: Validate WebChat hotfix version
        working-directory: chat-widget
        run: yarn test:webchat-version
      - name: Fetch base branch
        working-directory: chat-widget
        run: git fetch origin main:main
      - name: Validate using DangerJS
        working-directory: chat-widget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn danger ci --dangerfile dangerfile.js --base main
          if [ $? -ne 0 ]; then exit $?; fi
        shell: bash
      - name: Install playwright jest packages
        working-directory: chat-widget/automation_tests
        run: yarn install --network-timeout 1000000
      - name: Install Playwright browsers
        working-directory: chat-widget/automation_tests
        run: yarn playwright install --with-deps chromium
      - name: Unit Tests
        working-directory: chat-widget
        run: yarn test:unit
      - name: Build sample for E2E
        working-directory: chat-widget
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build-sample
      - name: Validate CommonJS package
        working-directory: chat-widget
        run: yarn test:cjs
      - name: Audit packed consumer
        id: packed-consumer-audit
        continue-on-error: true
        working-directory: chat-widget
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "chat-widget-consumer"
          $tarball = Join-Path $env:RUNNER_TEMP "chat-widget.tgz"
          New-Item -ItemType Directory -Path $consumer -Force | Out-Null
          yarn pack --filename $tarball --silent
          Set-Content -Path (Join-Path $consumer "package.json") -Value '{"name":"chat-widget-consumer","version":"1.0.0","private":true}'
          Push-Location $consumer
          try {
            npm install $tarball --ignore-scripts --no-fund
            $auditPath = Join-Path $consumer "audit.json"
            npm audit --omit=dev --json | Set-Content -Path $auditPath -Encoding utf8NoBOM
            node (Join-Path $env:GITHUB_WORKSPACE "chat-widget/scripts/validate-consumer-audit.cjs") $auditPath
          } finally {
            Pop-Location
          }
      - name: E2E Tests
        working-directory: chat-widget/automation_tests
        run: yarn test
      - name: Build Storybook
        working-directory: chat-widget
        env :
          NODE_OPTIONS: --openssl-legacy-provider
        run : yarn build-storybook
      - name: VRT Tests
        working-directory: chat-widget
        run: |
          echo "::group::Running Visual Regression Tests"
          yarn test:visual --verbose --no-coverage --passWithNoTests --testFailureExitCode=1 || echo "::error::Visual tests failed - check artifacts for details"
          echo "::endgroup::"
      - name: List failed test artifacts
        if: failure()
        working-directory: chat-widget
        shell: powershell
        run: |
          Write-Host "::group::Failed Test Artifacts"
          Get-ChildItem -Path "." -Recurse -Include "*__diff_output__*", "*__received__*", "*test-results*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "Path: $($_.FullName)" }
          Write-Host "::endgroup::"
      - name: Upload VRT Tests failures screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: VRT Failure Screenshots
          path: |
            chat-widget/**/__diff_output__/*.png
            chat-widget/**/__received__/*.png
            chat-widget/**/test-results/*.xml
      - name: Build package
        working-directory: chat-widget
        run: yarn build
      - name: Enforce packed consumer audit
        if: always() && steps.packed-consumer-audit.outcome == 'failure'
        shell: pwsh
        run: exit 1
